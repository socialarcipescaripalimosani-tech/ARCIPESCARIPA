# Dati Generali del Circolo
title: "ARCI PESCA FISA APS RIPALIMOSANI"
tagline: "Circolo di Pesca Sportiva • Fiume Biferno"
description: "Sito ufficiale dell'ARCI PESCA FISA APS RIPALIMOSANI Affiliato ARCI Pesca F.I.S.A. Concessione di pesca sportiva sul Fiume Biferno."
email: "arcipescaripalimosani@outlook.it"
societa: "ARCI PESCA FISA APS RIPALIMOSANI"

# Tratto in Concessione Ufficiale Fiume Biferno
