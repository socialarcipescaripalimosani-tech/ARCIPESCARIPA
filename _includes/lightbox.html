<!-- Modal Lightbox per Locandine a Schermo Intero -->
<div id="lightbox-modal" class="lightbox-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Visualizzatore locandina">
  <div class="lightbox-backdrop" id="lightbox-backdrop"></div>
  
  <div class="lightbox-content">
    <button class="lightbox-close-btn" id="lightbox-close" aria-label="Chiudi visualizzazione a schermo intero (Tasto Esc)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
    
    <div class="lightbox-image-wrapper">
      <img id="lightbox-img" class="lightbox-img" src="" alt="Locandina Ingrandita" />
    </div>

    <div class="lightbox-caption" id="lightbox-caption">
      <!-- Inserito dinamicamente da JavaScript -->
    </div>
  </div>
</div>
