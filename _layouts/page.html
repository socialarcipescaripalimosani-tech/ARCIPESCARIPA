---
layout: default
---
<div class="page-header">
  <div class="container">
    <div class="page-header-content">
      <span class="page-eyebrow">{{ page.eyebrow | default: "ARCI Pesca Ripalimosani" }}</span>
      <h1 class="page-title">{{ page.title }}</h1>
      {% if page.subtitle %}
      <p class="page-subtitle">{{ page.subtitle }}</p>
      {% endif %}
    </div>
  </div>
</div>

<div class="page-content-wrapper">
  <div class="container">
    {{ content }}
  </div>
</div>
